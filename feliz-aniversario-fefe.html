<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY BIRTHDAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #170c20;
      --bg-mid: #2e1a42;
      --purple-1: #7a4fa3;
      --purple-2: #a172d6;
      --lavender: #d9c3f5;
      --pink-accent: #e8a7c9;
      --cream: #f6eee1;
      --text-light: #f3e9ff;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      color: var(--text-light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    .handwritten {
      font-family: 'Caveat', cursive;
    }

    /* ambient blobs, fixed for softness across whole page */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      z-index: 0;
      pointer-events: none;
    }

    .blob.b1 {
      width: 420px;
      height: 420px;
      background: var(--purple-2);
      top: -10%;
      left: -10%;
    }

    .blob.b2 {
      width: 380px;
      height: 380px;
      background: var(--pink-accent);
      bottom: 5%;
      right: -8%;
      opacity: .22;
    }

    .blob.b3 {
      width: 300px;
      height: 300px;
      background: var(--lavender);
      top: 45%;
      left: 60%;
      opacity: .15;
    }

    section,
    .hero,
    footer {
      position: relative;
      z-index: 1;
    }

    /* ---------- HERO ---------- */
    .hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      overflow: hidden;
    }

    .hero>* {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(3.4rem, 12vw, 8rem);
      line-height: .95;
      text-shadow: 0 0 50px rgba(161, 114, 214, .5);
    }

    .scroll-cue {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Mono', monospace;
      font-size: .68rem;
      letter-spacing: .2em;
      color: var(--lavender);
      opacity: .55;
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, 8px);
      }
    }

    .petal {
      position: fixed;
      width: 9px;
      height: 11px;
      border-radius: 70% 0 70% 0;
      opacity: .55;
      z-index: 0;
      pointer-events: none;
      animation: petalDrift linear infinite;
    }

    /* pétalas viram estrelas de 5 pontas por um instante (ao apagar todas as velas) */
    .petal {
      transition: scale .4s ease;
    }

    body.stars .petal {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      border-radius: 0;
      scale: 2;
    }

    @keyframes petalDrift {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: var(--p-opacity, .5);
      }

      100% {
        transform: translate(var(--tx), var(--ty)) rotate(var(--rot, 360deg));
        opacity: 0;
      }
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 5rem 1.5rem;
      text-align: center;
    }

    .section-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.1rem, 6vw, 3rem);
      margin-bottom: 2.2rem;
    }


    /* ---------- COLLAGE (fotos reais, sem texto) ---------- */
    .collage {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      max-width: 820px;
      margin: 0 auto;
    }

    .collage img {
      width: 150px;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .7);
      filter: saturate(1.12) contrast(1.02);
      animation: float 5s ease-in-out infinite;
    }

    .collage img:nth-child(1) {
      transform: rotate(-4deg);
      animation-delay: 0s;
    }

    .collage img:nth-child(2) {
      transform: rotate(3deg) translateY(-10px);
      animation-delay: .5s;
      width: 170px;
      height: 210px;
    }

    .collage img:nth-child(3) {
      transform: rotate(-2deg);
      animation-delay: 1s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(var(--r, 0deg));
      }

      50% {
        transform: translateY(-10px) rotate(var(--r, 0deg));
      }
    }

    /* ---------- WISH / CANDLES ---------- */
    .candles {
      display: flex;
      justify-content: center;
      gap: clamp(2px, 2vw, 20px);
      margin-bottom: 1.4rem;
    }

    .candle {
      cursor: pointer;
      background: none;
      border: none;
      padding: .5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
    }

    .flame {
      width: 13px;
      height: 19px;
      background: radial-gradient(circle at 50% 70%, #ffe9b0, var(--pink-accent) 60%, transparent 75%);
      border-radius: 50%/60% 60% 40% 40%;
      transition: opacity .3s ease, transform .3s ease;
      animation: flicker 1.4s ease-in-out infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        transform: scale(1) rotate(-2deg);
      }

      50% {
        transform: scale(1.08) rotate(2deg);
      }
    }

    .candle.blown .flame {
      opacity: 0;
      transform: scale(.2);
    }

    .stick {
      width: 9px;
      height: 42px;
      background: linear-gradient(180deg, var(--lavender), var(--purple-1));
      border-radius: 3px;
    }

    .wish-msg {
      font-family: 'Caveat', cursive;
      font-size: clamp(3.2rem, 15vw, 5rem);
      line-height: 1;
      display: block;
      width: fit-content;
      margin: .6rem auto 0;
      color: var(--pink-accent);
      text-shadow: 0 0 14px rgba(232, 167, 201, .7), 0 0 34px rgba(161, 114, 214, .6);
      min-height: clamp(3.2rem, 15vw, 5rem);
      opacity: 0;
      transition: opacity .5s ease;
    }

    .wish-msg.show {
      opacity: 1;
      animation: wishPulse 1.6s ease-in-out infinite;
    }

    @keyframes wishPulse {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
        text-shadow: 0 0 10px rgba(232, 167, 201, .55), 0 0 24px rgba(161, 114, 214, .45);
      }

      50% {
        transform: scale(1.3) rotate(12deg);
        text-shadow: 0 0 22px rgba(255, 255, 255, .85), 0 0 50px rgba(232, 167, 201, .9), 0 0 80px rgba(161, 114, 214, .8);
      }
    }

    /* ---------- GUESS GAME ---------- */
    .guess-box {
      background: var(--glass);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 2.2rem 1.6rem;
      max-width: 380px;
      margin: 0 auto;
    }

    .guess-box input {
      width: 100%;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem;
      padding: .7rem;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, .05);
      color: var(--text-light);
      outline: none;
      margin-bottom: 1rem;
    }

    .guess-box input::placeholder {
      color: rgba(243, 233, 255, .4);
    }

    .guess-box button {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      padding: .75rem 1.6rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(120deg, var(--purple-2), var(--pink-accent));
      color: #1c0f28;
    }

    .guess-feedback {
      margin-top: 1rem;
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      min-height: 1.6rem;
      color: var(--lavender);
    }

    /* correct celebration */
    .celebrate-piece {
      position: fixed;
      top: -10px;
      z-index: 998;
      pointer-events: none;
    }

    /* jumpscare overlay */
    .jumpscare {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0510;
      opacity: 0;
      pointer-events: none;
      transition: opacity .05s;
    }

    .jumpscare.active {
      opacity: 1;
      pointer-events: auto;
    }

    .jumpscare img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .jumpscare.active img {
      animation: imgShake .08s linear infinite;
    }

    .jumpscare-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6vh;
      text-align: center;
      font-size: 1rem;
      letter-spacing: .04em;
      color: rgba(255, 255, 255, .55);
      text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
      pointer-events: none;
    }

    @keyframes imgShake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      50% {
        transform: translateX(8px);
      }

      75% {
        transform: translateX(-6px);
      }

      100% {
        transform: translateX(6px);
      }
    }

    /* ---------- TERMO MINIGAME ---------- */
    .termo-board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 1.6rem;
    }

    .termo-row {
      display: flex;
      gap: 5px;
    }

    .termo-cell {
      --cell: min(48px, calc((100vw - 1.5rem - 35px) / 8));
      width: var(--cell);
      height: var(--cell);
      border: 2px solid var(--glass-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: clamp(.9rem, 2.5vw, 1.3rem);
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      transition: border-color .15s;
      perspective: 400px;
    }

    .termo-cell.filled {
      border-color: var(--lavender);
    }

    .termo-cell.pop {
      animation: termoPop .1s ease;
    }

    @keyframes termoPop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }
    }

    .termo-cell.flip {
      animation: termoFlip .5s ease forwards;
    }

    @keyframes termoFlip {
      0% {
        transform: rotateX(0);
      }

      50% {
        transform: rotateX(90deg);
      }

      100% {
        transform: rotateX(0);
      }
    }

    .termo-cell.correct {
      background: #538d4e;
      border-color: #538d4e;
    }

    .termo-cell.present {
      background: #b59f3b;
      border-color: #b59f3b;
    }

    .termo-cell.absent {
      background: #3a3a4c;
      border-color: #3a3a4c;
    }

    .termo-keyboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: .8rem auto 0;
      width: 100%;
      max-width: 500px;
    }

    .termo-kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }

    .termo-key {
      flex: 1 1 0;
      min-width: 0;
      max-width: 44px;
      height: clamp(46px, 12vw, 54px);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, .18);
      color: var(--text-light);
      font-family: 'Space Mono', monospace;
      font-size: clamp(.8rem, 3.4vw, .95rem);
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
    }

    @media (hover: hover) {
      .termo-key:hover {
        background: rgba(255, 255, 255, .3);
      }
    }

    .termo-key.wide {
      flex: 1.6 1 0;
      max-width: 68px;
      font-size: clamp(.6rem, 2.6vw, .8rem);
    }

    .termo-key.correct {
      background: #538d4e;
    }

    .termo-key.present {
      background: #b59f3b;
    }

    .termo-key.absent {
      background: #3a3a4c;
      color: rgba(255, 255, 255, .45);
    }

    .termo-msg {
      margin-top: 1rem;
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      min-height: 1.8rem;
      color: var(--pink-accent);
    }

    footer {
      text-align: center;
      padding: 3rem 1.5rem 3.5rem;
    }

    footer p {
      font-family: 'Space Mono', monospace;
      font-size: .68rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--lavender);
      opacity: .5;
    }

    /* ---------- CELULAR ---------- */
    @media (max-width: 600px) {
      section {
        padding: 3.5rem 1.25rem 4rem;
      }

      section.termo-section {
        padding-left: .75rem;
        padding-right: .75rem;
      }

      .section-title {
        margin-bottom: 1.6rem;
      }

      /* blur pesado em elementos fixos deixa o scroll travado no celular */
      .blob {
        filter: blur(55px);
      }

      .blob.b1 {
        width: 260px;
        height: 260px;
      }

      .blob.b2 {
        width: 240px;
        height: 240px;
      }

      .blob.b3 {
        width: 200px;
        height: 200px;
      }

      /* fotos: duas em cima, uma centralizada embaixo */
      .collage {
        gap: 1rem;
      }

      .collage img,
      .collage img:nth-child(2) {
        width: min(160px, calc(50% - .5rem));
        height: auto;
        aspect-ratio: 150 / 190;
      }

      .guess-box {
        padding: 1.8rem 1.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- ================= HERO ================= -->
  <section class="hero">
    <div id="petals"></div>
    <h1>Feliz<br>Aniversário</h1>
    <div class="scroll-cue">Tulipas né? ↓</div>
  </section>

  <!-- ================= COLLAGE ================= -->
  <section>
    <div class="collage">
      <img src="https://images.pexels.com/photos/7474950/pexels-photo-7474950.jpeg?auto=compress&cs=tinysrgb&w=500"
        alt="">
      <img src="https://images.pexels.com/photos/33484355/pexels-photo-33484355.jpeg?auto=compress&cs=tinysrgb&w=500"
        alt="">
      <img src="https://images.pexels.com/photos/30786293/pexels-photo-30786293.jpeg?auto=compress&cs=tinysrgb&w=500"
        alt="">
    </div>
  </section>

  <!-- ================= PEDIDO ================= -->
  <section>
    <div class="section-inner">
      <h2 class="section-title">Faz um pedido.</h2>
      <div class="candles" id="candles">
        <button class="candle" aria-label="apagar vela"><span class="flame"></span><span class="stick"></span></button>
        <button class="candle" aria-label="apagar vela"><span class="flame"></span><span class="stick"></span></button>
        <button class="candle" aria-label="apagar vela"><span class="flame"></span><span class="stick"></span></button>
      </div>
      <p class="wish-msg" id="wishMsg">✦</p>
    </div>
  </section>

  <!-- ================= TERMO MINIGAME ================= -->
  <section class="termo-section">
    <div class="section-inner">
      <h2 class="section-title">Termo!</h2>
      <div id="termoBoard" class="termo-board"></div>
      <div id="termoKeyboard" class="termo-keyboard"></div>
      <div class="termo-msg" id="termoMsg"></div>
    </div>
  </section>

  <!-- ================= GUESS GAME ================= -->
  <section>
    <div class="section-inner">
      <h2 class="section-title">Quantos aninhos?</h2>
      <div class="scroll-cue">Não minta ou se arrependerá. . .</div>
      <div class="guess-box">
        <input id="ageInput" type="number" placeholder="sua idade" inputmode="numeric">
        <br>
        <button id="ageBtn">confirmar</button>
        <div class="guess-feedback" id="ageFeedback"></div>
      </div>
    </div>
  </section>

  <div class="jumpscare" id="jumpscare"><img src="susto.gif" alt="susto"><p class="jumpscare-caption">Pq vc tá mentindo???</p></div>

  <script>
    // pétalas caindo de cantos e bordas aleatórias
    const petalContainer = document.getElementById('petals');
    function spawnPetal() {
      const p = document.createElement('div');
      p.className = 'petal';

      // escolhe uma borda aleatória: 0=topo, 1=direita, 2=baixo, 3=esquerda
      const edge = Math.floor(Math.random() * 4);
      let startX, startY, tx, ty;

      switch (edge) {
        case 0: // topo
          startX = Math.random() * 100;
          startY = -2;
          tx = (Math.random() * 60 - 30) + 'vw';
          ty = (80 + Math.random() * 40) + 'vh';
          break;
        case 1: // direita
          startX = 102;
          startY = Math.random() * 100;
          tx = -(60 + Math.random() * 40) + 'vw';
          ty = (Math.random() * 60 - 20) + 'vh';
          break;
        case 2: // baixo
          startX = Math.random() * 100;
          startY = 102;
          tx = (Math.random() * 60 - 30) + 'vw';
          ty = -(80 + Math.random() * 40) + 'vh';
          break;
        case 3: // esquerda
          startX = -2;
          startY = Math.random() * 100;
          tx = (60 + Math.random() * 40) + 'vw';
          ty = (Math.random() * 60 - 20) + 'vh';
          break;
      }

      p.style.left = startX + 'vw';
      p.style.top = startY + 'vh';

      const dur = 7 + Math.random() * 8;
      p.style.animationDuration = dur + 's';

      const opacity = 0.2 + Math.random() * 0.4;
      p.style.setProperty('--p-opacity', opacity);
      p.style.setProperty('--tx', tx);
      p.style.setProperty('--ty', ty);
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.background = Math.random() > 0.5 ? '#a172d6' : '#e8a7c9';
      p.style.width = (7 + Math.random() * 6) + 'px';
      p.style.height = (9 + Math.random() * 7) + 'px';

      document.body.appendChild(p);
      setTimeout(() => p.remove(), dur * 1000);
    }

    // spawna pétalas iniciais espalhadas
    for (let i = 0; i < 18; i++) {
      setTimeout(() => spawnPetal(), Math.random() * 6000);
    }
    // continua gerando novas pétalas
    setInterval(() => spawnPetal(), 800 + Math.random() * 600);

    // candles
    const candles = document.querySelectorAll('.candle');
    const wishMsg = document.getElementById('wishMsg');
    candles.forEach(c => {
      c.addEventListener('click', () => {
        c.classList.toggle('blown');
        const allBlown = Array.from(candles).every(x => x.classList.contains('blown'));
        wishMsg.classList.toggle('show', allBlown);
        if (allBlown) starBurst();
      });
    });

    // ao apagar todas as velas, as pétalas viram estrelas por 2s e depois voltam
    let starTimer;
    function starBurst() {
      document.body.classList.add('stars');
      clearTimeout(starTimer);
      starTimer = setTimeout(() => document.body.classList.remove('stars'), 2000);
    }

    // áudio de acerto
    const yayAudio = new Audio('kids-saying-yay-sound-effect_3.mp3');

    // áudio do susto (monochrome-lol.mp3)
    const scareAudio = new Audio('amazing-grace-analog-horror.mp3');

    function celebrate() {
      const colors = ['#a172d6', '#e8a7c9', '#d9c3f5', '#7a4fa3'];
      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'celebrate-piece';
        const isPetal = Math.random() > 0.5;
        c.style.left = Math.random() * 100 + 'vw';
        c.style.width = isPetal ? '10px' : '8px';
        c.style.height = isPetal ? '12px' : '8px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = isPetal ? '70% 0 70% 0' : (Math.random() > 0.5 ? '50%' : '2px');
        c.style.opacity = '0.9';
        const duration = 2.5 + Math.random() * 2;
        c.style.transition = `transform ${duration}s ease-in, opacity ${duration}s ease-in`;
        document.body.appendChild(c);
        requestAnimationFrame(() => {
          c.style.transform = `translateY(${100 + Math.random() * 20}vh) rotate(${Math.random() * 720}deg)`;
          c.style.opacity = '0';
        });
        setTimeout(() => c.remove(), duration * 1000 + 100);
      }
    }

    function jumpscare() {
      const el = document.getElementById('jumpscare');
      // som começa um pouco antes da imagem
      scareAudio.currentTime = 0;
      const hide = () => el.classList.remove('active');
      // no celular o áudio pode ser bloqueado ou falhar: sem isso a tela ficaria travada
      const p = scareAudio.play();
      if (p && p.catch) p.catch(() => setTimeout(hide, 2500));
      setTimeout(() => {
        el.classList.add('active');
      }, 300);
      // quando o áudio terminar, para tudo
      scareAudio.onended = hide;
      scareAudio.onerror = () => setTimeout(hide, 2500);
    }

    const ageInput = document.getElementById('ageInput');
    const ageBtn = document.getElementById('ageBtn');
    const ageFeedback = document.getElementById('ageFeedback');
    const CORRECT_AGE = 16;

    function checkAge() {
      const val = parseInt(ageInput.value, 10);
      if (val === CORRECT_AGE) {
        ageFeedback.textContent = 'isso aí 🎉';
        yayAudio.currentTime = 0;
        yayAudio.play();
        celebrate();
      } else if (!isNaN(val)) {
        ageFeedback.textContent = 'hmm... tenta de novo 👀';
        jumpscare();
      }
    }
    ageBtn.addEventListener('click', checkAge);
    ageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAge(); });

    // ============ TERMO MINIGAME ============
    (function () {
      const WORD = 'PARABENS';
      const WORD_LEN = WORD.length;
      const MAX_TRIES = 6;
      let currentRow = 0;
      let currentCol = 0;
      let gameOver = false;
      const board = [];

      const boardEl = document.getElementById('termoBoard');
      const kbEl = document.getElementById('termoKeyboard');
      const msgEl = document.getElementById('termoMsg');

      // build board
      for (let r = 0; r < MAX_TRIES; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'termo-row';
        const rowData = [];
        for (let c = 0; c < WORD_LEN; c++) {
          const cell = document.createElement('div');
          cell.className = 'termo-cell';
          rowEl.appendChild(cell);
          rowData.push({ el: cell, letter: '' });
        }
        boardEl.appendChild(rowEl);
        board.push(rowData);
      }

      // build keyboard
      const kbRows = [
        ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
        ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
        ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫']
      ];
      const keyEls = {};
      kbRows.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'termo-kb-row';
        row.forEach(key => {
          const btn = document.createElement('button');
          btn.className = 'termo-key' + (key === 'ENTER' || key === '⌫' ? ' wide' : '');
          btn.textContent = key;
          btn.addEventListener('click', () => handleKey(key));
          rowEl.appendChild(btn);
          keyEls[key] = btn;
        });
        kbEl.appendChild(rowEl);
      });

      // physical keyboard
      document.addEventListener('keydown', (e) => {
        if (gameOver) return;
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'Enter') return handleKey('ENTER');
        if (e.key === 'Backspace') return handleKey('⌫');
        const k = e.key.toUpperCase();
        if (/^[A-Z]$/.test(k)) handleKey(k);
      });

      function handleKey(key) {
        if (gameOver) return;
        if (key === '⌫') {
          if (currentCol > 0) {
            currentCol--;
            board[currentRow][currentCol].letter = '';
            board[currentRow][currentCol].el.textContent = '';
            board[currentRow][currentCol].el.classList.remove('filled');
          }
          return;
        }
        if (key === 'ENTER') {
          if (currentCol < WORD_LEN) return; // not enough letters
          revealRow();
          return;
        }
        // letter
        if (currentCol >= WORD_LEN) return;
        board[currentRow][currentCol].letter = key;
        board[currentRow][currentCol].el.textContent = key;
        board[currentRow][currentCol].el.classList.add('filled', 'pop');
        setTimeout(() => board[currentRow][currentCol - 1]?.el.classList.remove('pop'), 100);
        currentCol++;
      }

      function revealRow() {
        const guess = board[currentRow].map(c => c.letter).join('');
        const result = getResult(guess);

        board[currentRow].forEach((cell, i) => {
          setTimeout(() => {
            cell.el.classList.add('flip');
            setTimeout(() => {
              cell.el.classList.add(result[i]);
              // update keyboard
              const k = cell.letter;
              const kbBtn = keyEls[k];
              if (result[i] === 'correct') {
                kbBtn.className = 'termo-key correct';
              } else if (result[i] === 'present' && !kbBtn.classList.contains('correct')) {
                kbBtn.className = 'termo-key present';
              } else if (result[i] === 'absent' && !kbBtn.classList.contains('correct') && !kbBtn.classList.contains('present')) {
                kbBtn.className = 'termo-key absent';
              }
            }, 250);
          }, i * 150);
        });

        setTimeout(() => {
          if (guess === WORD) {
            msgEl.textContent = 'boa!! 🎉🎉🎉';
            gameOver = true;
            celebrate();
          } else if (currentRow >= MAX_TRIES - 1) {
            msgEl.textContent = 'era: ' + WORD + ' 💜';
            gameOver = true;
          } else {
            currentRow++;
            currentCol = 0;
          }
        }, WORD_LEN * 150 + 300);
      }

      function getResult(guess) {
        const result = Array(WORD_LEN).fill('absent');
        const wordArr = WORD.split('');
        const used = Array(WORD_LEN).fill(false);

        // greens first
        for (let i = 0; i < WORD_LEN; i++) {
          if (guess[i] === wordArr[i]) {
            result[i] = 'correct';
            used[i] = true;
          }
        }
        // then yellows
        for (let i = 0; i < WORD_LEN; i++) {
          if (result[i] === 'correct') continue;
          for (let j = 0; j < WORD_LEN; j++) {
            if (!used[j] && guess[i] === wordArr[j]) {
              result[i] = 'present';
              used[j] = true;
              break;
            }
          }
        }
        return result;
      }
    })();
  </script>
